<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Till Fonts — original open-source pixel typefaces</title>
<style>
  :root { color-scheme: dark; --face: monospace; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 96px;
    background: #0d0d10; color: #ffb000;
    font-family: var(--face), monospace;
    line-height: 1; -webkit-font-smoothing: none; font-smooth: never;
    display: flex; flex-direction: column; align-items: center; gap: 32px;
  }
  h1 { font-size: 72px; font-weight: 700; margin: 0; text-align: center; }
  p.tag { color: #967018; font-size: 24px; margin: 0; text-align: center; }
  section { width: min(92vw, 880px); }
  .lines { font-size: 24px; }
  .lines div { margin: 10px 0; }
  .bold { font-weight: 700; }
  .dim { color: #967018; }
  pre {
    font-family: inherit; font-size: 24px; line-height: 1; margin: 0 auto;
    background: #f7f2e7; color: #1a1815; padding: 26px 20px; width: max-content;
    box-shadow: 8px 10px 0 #00000055;
  }
  .tester {
    font-size: 36px; padding: 18px; border: 2px solid #967018; outline: none;
    min-height: 96px; width: 100%;
  }
  .sizes span { display: inline-block; margin-right: 24px; vertical-align: baseline; }
  a { color: #ffb000; }

  /* Font switcher. Sans-serif on purpose: it must stay legible while the
     specimen face changes underneath it. */
  nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  nav button {
    font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
    background: transparent; color: #967018; border: 1px solid #4a3a12;
    padding: 10px 16px; cursor: pointer;
  }
  nav button:hover { color: #ffb000; border-color: #967018; }
  nav button[aria-current="true"] { background: #ffb000; color: #0d0d10; border-color: #ffb000; }
  .meta { font: 400 12px/1.5 ui-sans-serif, system-ui, sans-serif; color: #6b5a2a; text-align: center; }
  .err { font: 400 14px/1.6 ui-sans-serif, system-ui, sans-serif; color: #c86; text-align: center; }
</style>
</head>
<body>
  <nav id="switch" aria-label="Choose a typeface"></nav>

  <div>
    <h1 id="name">TILL FONTS</h1>
    <p class="tag" id="tagline">LOADING…</p>
  </div>

  <section class="lines" id="lines"></section>

  <section id="sample-wrap"><pre id="sample"></pre></section>

  <section>
    <div class="dim" style="font-size:24px;margin-bottom:12px">TYPE SOMETHING:</div>
    <div class="tester" id="tester" contenteditable="true" spellcheck="false"></div>
  </section>

  <p class="meta" id="meta"></p>
  <p class="dim" style="font-size:24px">
    <a href="https://github.com/thijsvos/till-fonts">github.com/thijsvos/till-fonts</a>
  </p>

<script>
// The font list is generated by src/build_all.py, so this page can never drift
// from what was actually built. Adding a font to the family needs no edit here.
const $ = id => document.getElementById(id);

function loadFace(font) {
  // Register both weights under the family name, then point --face at it.
  return Promise.all(font.styles.map(style => {
    const weight = style === "Bold" ? 700 : 400;
    const url = `./fonts/${font.slug}/${font.psPrefix}-${style}.woff2`;
    const face = new FontFace(font.family, `url(${url})`, { weight: String(weight) });
    return face.load().then(f => document.fonts.add(f));
  }));
}

function render(font) {
  const spec = font.specimen || {};
  document.documentElement.style.setProperty("--face", `"${font.family}"`);
  $("name").textContent = font.family.toUpperCase();
  $("tagline").textContent = spec.tagline || font.description;

  $("lines").innerHTML = "";
  for (const line of (spec.lines || [])) {
    const d = document.createElement("div");
    d.textContent = line;
    $("lines").append(d);
  }
  if (spec.bold_line) {
    const d = document.createElement("div");
    d.className = "bold";
    d.textContent = spec.bold_line;
    $("lines").append(d);
  }

  // Size ladder derives from the cell height, so each face shows the sizes at
  // which it is actually pixel-perfect.
  const ladder = document.createElement("div");
  ladder.className = "sizes dim";
  for (const s of font.sizes) {
    const span = document.createElement("span");
    span.style.fontSize = s + "px";
    span.textContent = s + "px";
    ladder.append(span);
  }
  ladder.append(`— pixel-perfect at multiples of ${font.grid.rows}px`);
  $("lines").append(ladder);

  // [b]…[/b] marks the one bold run in the sample block.
  $("sample-wrap").style.display = spec.sample ? "" : "none";
  if (spec.sample) {
    $("sample").innerHTML = "";
    const parts = spec.sample.split(/\[b\]|\[\/b\]/);
    parts.forEach((part, i) => {
      const node = i % 2 ? document.createElement("span") : document.createTextNode(part);
      if (i % 2) { node.className = "bold"; node.textContent = part; }
      $("sample").append(node);
    });
  }

  $("tester").textContent = spec.tester || "Type here";
  const g = font.grid;
  $("meta").textContent =
    `${font.family} v${font.version} · ${font.glyphs} glyphs · ${g.cols}×${g.rows} cell · ` +
    `${font.styles.join(" + ")} · SIL OFL 1.1`;
}

function select(fonts, slug) {
  const font = fonts.find(f => f.slug === slug) || fonts[0];
  for (const b of document.querySelectorAll("#switch button"))
    b.setAttribute("aria-current", String(b.dataset.slug === font.slug));
  loadFace(font).then(() => render(font)).catch(() => render(font));
  history.replaceState(null, "", "#" + font.slug);
}

fetch("./fonts/manifest.json")
  .then(r => r.json())
  .then(({ fonts }) => {
    for (const font of fonts) {
      const b = document.createElement("button");
      b.textContent = font.family;
      b.dataset.slug = font.slug;
      b.onclick = () => select(fonts, font.slug);
      $("switch").append(b);
    }
    // Only show the switcher once there is a choice to make.
    $("switch").style.display = fonts.length > 1 ? "" : "none";
    select(fonts, location.hash.slice(1));
  })
  .catch(() => {
    $("tagline").textContent = "";
    $("meta").className = "err";
    $("meta").textContent =
      "Could not load fonts/manifest.json — serve this page over HTTP (python -m http.server) rather than opening the file directly.";
  });
</script>
</body>
</html>
