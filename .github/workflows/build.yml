name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege by default; the release job opts up to what it needs.
permissions:
  contents: read

env:
  # Pins head.created / head.modified so rebuilds are byte-identical.
  # Without this fontTools stamps "now" and the drift guard below can never pass.
  SOURCE_DATE_EPOCH: "1787097600"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # --require-hashes: a substituted wheel fails the install rather than
      # silently producing different font bytes.
      - run: pip install --require-hashes -r requirements.txt

      - name: Check version consistency
        run: python src/check_versions.py

      - name: Rebuild every font from source
        run: python src/build_all.py

      # git status, not git diff: diff is blind to UNTRACKED files, so a newly
      # added font that was never `git add`ed would rebuild in CI and pass the
      # guard while the repo shipped nothing.
      - name: Fail if committed fonts drift from source
        run: |
          drift="$(git status --porcelain -- fonts/ docs/fonts/)"
          if [ -n "$drift" ]; then
            echo "::error::Committed fonts do not match a fresh build"
            echo "$drift"
            echo "  '??' = a built font that was never committed"
            echo "  ' M' = a committed font that no longer matches source"
            echo "Fix locally with:"
            echo "  SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH python src/build_all.py"
            echo "  git add fonts docs && git commit --amend --no-edit"
            exit 1
          fi
          echo "Committed fonts match a fresh build."

      # Proof images are rendered but deliberately NOT guarded: Pillow encodes
      # PNGs slightly differently across versions, which would make CI flaky.
      - name: Render proof sheets
        run: |
          python src/proof.py
          python src/render_previews.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: till-fonts-proofs
          path: |
            proof_sheet*.png
            specimen*.png
            receipt_demo*.png

  # Backs the README's originality claim with an actual check: fails if any
  # glyph becomes byte-identical to a reference pixel font outside the known
  # single-solution shapes. Kept separate from `build` because it needs network
  # access to fetch the references, and it must not gate a release.
  originality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements.txt
      - name: Check glyphs against reference pixel fonts
        run: python src/check_originality.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: till-fonts-comparison
          path: compare_sheet*.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # OIDC token for provenance signing
      attestations: write  # record the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the release if the tag disagrees with package.json / the font's
      # own version -- v1.0.1 and v1.0.2 both shipped as "Version 1.000".
      - name: Check tag matches declared version
        run: python src/check_versions.py "${GITHUB_REF_NAME}"

      - name: Package fonts
        run: zip -r "till-fonts-${GITHUB_REF_NAME}.zip" fonts OFL.txt README.md

      # Lets anyone verify a downloaded font was built by this workflow from
      # this commit:  gh attestation verify <file> --repo thijsvos/till-fonts
      # Globs, not a hand-kept list: an explicit list silently leaves a newly
      # added font unattested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            fonts/*/ttf/*.ttf
            till-fonts-*.zip

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            fonts/*/ttf/*.ttf
            till-fonts-*.zip
