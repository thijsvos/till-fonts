name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege by default; the release job opts up to contents: write.
permissions:
  contents: read

env:
  # Pins head.created / head.modified so rebuilds are byte-identical.
  # Without this fontTools stamps "now" and the drift guard below can never pass.
  SOURCE_DATE_EPOCH: "1787097600"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Rebuild fonts from source
        run: python src/build_till_mono.py

      - name: Fail if committed fonts drift from source
        run: |
          if ! git diff --quiet -- fonts/ docs/fonts/; then
            echo "::error::Committed fonts do not match a fresh build of src/build_till_mono.py"
            git diff --stat -- fonts/ docs/fonts/
            echo "Fix locally with:"
            echo "  SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH python src/build_till_mono.py"
            echo "  git add fonts docs && git commit --amend --no-edit"
            exit 1
          fi
          echo "Committed fonts match a fresh build."

      # Proof images are rendered but deliberately NOT guarded: Pillow encodes
      # PNGs slightly differently across versions, which would make CI flaky.
      - name: Render proof sheets
        run: |
          python src/proof.py
          python src/render_previews.py

      - uses: actions/upload-artifact@v7
        with:
          name: till-mono-proofs
          path: |
            proof_sheet.png
            specimen.png
            receipt_demo.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Package fonts
        run: zip -r "till-mono-${GITHUB_REF_NAME}.zip" fonts OFL.txt README.md

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            fonts/ttf/TillMono-Regular.ttf
            fonts/ttf/TillMono-Bold.ttf
            till-mono-*.zip
