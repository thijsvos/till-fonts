version: 2
updates:
  # Actions used by .github/workflows/build.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Build toolchain in requirements.txt. Pins are exact, so each bump arrives as
  # its own PR and the drift guard proves whether it rewrites the font binaries.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
